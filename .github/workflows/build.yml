name: Build Mechagram APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Patch Configuration Files
        run: |
          # 1. Подмена IP-адреса VDS в C++ коде
          find TMessagesProj/jni/tgnet/ -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/YOUR_SERVER_IP/177.3.213.27/g' {} +
          find TMessagesProj/jni/tgnet/ -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/149\.154\.167\.50/177.3.213.27/g' {} +

          # 2. Название приложения Mechagram и имя пакета org.mechagram.web
          find TMessagesProj/ -name "build.gradle" -exec sed -i 's/applicationId .*/applicationId "org.mechagram.web"/g' {} +
          find TMessagesProj/src/main/res/ -name "strings.xml" -exec sed -i 's/<string name="AppName">.*<\/string>/<string name="AppName">Mechagram<\/string>/g' {} +

          # 3. Подстановка публичного RSA-ключа сервера в Datacenter.cpp
          sed -i '/static std::string public_key =/,/-----END RSA PUBLIC KEY-----";/c\
          static std::string public_key = \
                  "-----BEGIN RSA PUBLIC KEY-----\\n"\
                  "MIIBCgKCAQEAy/wGikIrrcWObe+EuCVb9JtQNAzpAyI5nKjQ/4DGspGY1CFNNViV\\n"\
                  "XDmtjM/ljiBVaV2Sx5fBeM/kjcT6mRaByNhu04xhZqEmWRkr4sTXnI3NwxMucepK\\n"\
                  "mBd9V6S53BGEoXqCV/OTkw7K9kOKwtXueBl3J+PlXjeUCsy5r1bVYEOJq2Gh5sNC\\n"\
                  "EH/zc2GC08wC4A85vCx72bx56XXw4K+gZb1ou1ncR/GTshZu+nNrxgzGjb1kC/XJ\\n"\
                  "BNDNC3zPmd5JqKVrf33YjL/5Wgc76k6LA3P4t/d/h6KDzNJkPMUYaazqt4EQeTFW\\n"\
                  "4zAiiMVELMb1VBekejvTcFwuxzTkdj3T8QIDAQAB\\n"\
                  "-----END RSA PUBLIC KEY-----";' TMessagesProj/jni/tgnet/Datacenter.cpp

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew --no-daemon --max-workers=2 :TMessagesProj_App:assembleRelease -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mechagram-Release-APK
          path: "TMessagesProj_App/build/outputs/apk/**/*.apk"
